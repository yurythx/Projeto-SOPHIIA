# Barreira contra commit de segredos (achado de auditoria: uma chave RSA
# privada de dev vive em secrets/ — hoje coberta por .gitignore, mas um
# `git add -f` ou um .gitignore editado a colocaria no histórico).
#
# Instalar uma vez:  pipx install pre-commit && pre-commit install
# Rodar em tudo:     pre-commit run --all-files
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
